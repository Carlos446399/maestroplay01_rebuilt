[build]
  command = "pnpm install && pnpm build"
  publish = "dist/public"
  functions = "netlify/functions"

[dev]
  command = "pnpm dev"
  port = 3000

# Proxy para Google Drive — DEVE vir antes do catch-all do SPA
[[redirects]]
  from = "/drive-proxy"
  to = "/.netlify/functions/drive-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/drive-proxy/*"
  to = "/.netlify/functions/drive-proxy"
  status = 200
  force = true

# SPA catch-all
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
