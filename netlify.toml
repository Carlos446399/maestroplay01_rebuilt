[build]
  command = "pnpm install && pnpm build"
  publish = "dist/public"
  functions = "netlify/functions"

[dev]
  command = "pnpm dev"
  port = 3000

# Edge Function para proxy do Drive (streaming sem limite de tamanho)
# DEVE vir antes do catch-all do SPA
[[edge_functions]]
  path = "/api/drive-proxy"
  function = "drive-proxy"

# Edge Function para proxy da listagem de pastas/arquivos do Drive
# (mantém a API key apenas no servidor)
[[edge_functions]]
  path = "/api/drive-list"
  function = "drive-list"

# Edge Function para busca no YouTube com cache compartilhado
# (economiza cota da API entre todos os usuários)
[[edge_functions]]
  path = "/api/youtube-search"
  function = "youtube-search"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
